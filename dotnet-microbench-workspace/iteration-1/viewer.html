<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BenchmarkDotNet Eval Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
    }
    
    h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }
    
    .main {
      display: flex;
      gap: 1px;
      flex: 1;
      overflow: hidden;
      background: #30363d;
    }
    
    .panel {
      flex: 1;
      overflow-y: auto;
      background: #0d1117;
      padding: 24px;
    }
    
    .panel h2 {
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .prompt {
      background: #161b22;
      border-left: 3px solid #3fb950;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
      font-family: "Monaco", "Courier New", monospace;
    }
    
    code {
      color: #79c0ff;
    }
    
    .results {
      background: transparent;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .results table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      border: 1px solid #30363d;
    }
    
    .results th {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
    }
    
    .results td {
      border: 1px solid #30363d;
      padding: 8px 12px;
    }
    
    .results h3 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #d0d4d9;
    }
    
    .results p {
      margin-bottom: 8px;
    }
    
    .results strong {
      color: #d0d4d9;
    }
    
    .nav {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #30363d;
    }
    
    button {
      background: #238636;
      color: #fff;
      border: 1px solid #2ea043;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    
    button:hover {
      background: #2ea043;
    }
    
    button:disabled {
      background: #30363d;
      border-color: #21262d;
      color: #6e7681;
      cursor: not-allowed;
    }
    
    .eval-counter {
      font-size: 12px;
      color: #8b949e;
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 BenchmarkDotNet Eval Viewer</h1>
      <div class="subtitle">Code on left, results on right</div>
    </header>
    
    <div class="main">
      <div class="panel">
        <h2>Benchmark Code</h2>
        <div class="prompt" id="prompt"></div>
        <pre><code id="code"></code></pre>
      </div>
      
      <div class="panel">
        <h2>Results & Analysis</h2>
        <div class="results" id="results"></div>
        <div class="nav">
          <button id="prevBtn" onclick="prevEval()">← Previous</button>
          <span class="eval-counter"><span id="current">1</span> / <span id="total">2</span></span>
          <button id="nextBtn" onclick="nextEval()">Next →</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const evals = [
      {
        "name": "loop-vs-linq-sum",
        "prompt": "I want to benchmark the performance difference between a manual foreach loop and LINQ for summing an array of 10,000 integers. Which is faster?",
        "code": "#:package BenchmarkDotNet@0.14.0\n#:property PublishAot=false\n\nusing BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\nBenchmarkRunner.Run<ArraySum>();\n\n[InProcess]\n[MemoryDiagnoser]\npublic class ArraySum\n{\n    private readonly int[] data = Enumerable.Range(0, 10_000).ToArray();\n\n    [Benchmark]\n    public int Loop()\n    {\n        var sum = 0;\n        foreach (var x in data) sum += x;\n        return sum;\n    }\n\n    [Benchmark]\n    public int Linq() => data.Sum();\n}",
        "results": "<strong>LINQ wins by ~3.3%</strong>. Both approaches produce zero heap allocations, so memory efficiency is identical.<table><thead><tr><th>Method</th><th>Mean Time</th><th>Allocations</th></tr></thead><tbody><tr><td>Foreach</td><td>3.035 µs</td><td>0 bytes</td></tr><tr><td>LINQ Sum()</td><td>2.934 µs</td><td>0 bytes</td></tr></tbody></table><h3>Why LINQ is faster here</h3><p>Modern .NET's JIT compiler specializes LINQ methods like `Sum()` when given simple predicates. The JIT can apply additional optimizations because it understands the LINQ method's intent.</p>"
      },
      {
        "name": "string-concatenation-vs-builder",
        "prompt": "I need to benchmark concatenating 1000 strings. Is string concatenation or StringBuilder faster? Show me the allocation differences too.",
        "code": "#:package BenchmarkDotNet@0.14.0\n#:property PublishAot=false\n\nusing BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\nBenchmarkRunner.Run<StringConcatBench>();\n\n[InProcess]\n[MemoryDiagnoser]\npublic class StringConcatBench\n{\n    [Benchmark]\n    public string ConcatenationOperator()\n    {\n        string result = \"\";\n        for (int i = 0; i < 1000; i++)\n            result += \"x\";\n        return result;\n    }\n\n    [Benchmark]\n    public string UsingStringBuilder()\n    {\n        var sb = new System.Text.StringBuilder();\n        for (int i = 0; i < 1000; i++)\n            sb.Append(\"x\");\n        return sb.ToString();\n    }\n}",
        "results": "<strong>StringBuilder wins decisively</strong> (~81x faster, ~221x less allocation).<table><thead><tr><th>Method</th><th>Mean time</th><th>Allocated</th></tr></thead><tbody><tr><td>+= concat</td><td>335.3 us</td><td>6,684 KB</td></tr><tr><td>StringBuilder</td><td>4.13 us</td><td>30.2 KB</td></tr></tbody></table><h3>Why the gap is so large</h3><p><strong>Time:</strong> Each `result += ...` allocates a brand-new string and copies everything built so far (O(n²)). StringBuilder grows a buffer geometrically (O(n)).</p><p><strong>Allocations:</strong> += produced ~6.7 MB of garbage. StringBuilder allocates only a handful of buffer resizes (30 KB total).</p><p><strong>Takeaway:</strong> For any loop building a string incrementally, use StringBuilder.</p>"
      }
    ];
    
    let currentIdx = 0;
    
    function showEval(idx) {
      if (idx < 0 || idx >= evals.length) return;
      currentIdx = idx;
      
      const eval = evals[idx];
      document.getElementById('prompt').textContent = eval.prompt;
      document.getElementById('code').textContent = eval.code;
      document.getElementById('results').innerHTML = eval.results;
      document.getElementById('current').textContent = idx + 1;
      document.getElementById('total').textContent = evals.length;
      
      document.getElementById('prevBtn').disabled = idx === 0;
      document.getElementById('nextBtn').disabled = idx === evals.length - 1;
    }
    
    function prevEval() {
      showEval(currentIdx - 1);
    }
    
    function nextEval() {
      showEval(currentIdx + 1);
    }
    
    showEval(0);
  </script>
</body>
</html>
